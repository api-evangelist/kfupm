  - date: '2026-08-30'
    rating: 2
    summary: >-
      University-pipeline re-profile. Operator attribution was settled before anything was saved.
      The 37 OpenAPI definitions this repo held as KFUPM's were one Elsevier Pure Web Services
      contract (info.title "Pure API", contact pure-support@elsevier.com, version 5.35.3-4)
      served from KFUPM's Pure tenant, and at least nine other universities in this catalog ship
      the same titles. All 37, their _original source and every artifact derived from them —
      collections, json-schema, json-structure, examples, rules, vocabulary, json-ld,
      authentication, agentic-access, 124 files — were removed, and the Pure deployment is now
      recorded once as a tenant relationship. Note that the Pure OpenAPI on this tenant returns
      401 to an anonymous client, so those specs never came from KFUPM's host.

      Three institution-operated surfaces were found and verified that had never been catalogued.
      The significant one is identity: KFUPM runs its own AD FS identity provider at
      sts.kfupm.edu.sa, publishing signed SAML 2.0 federation metadata and an OpenID Connect
      discovery document, and registered in eduGAIN as entity 671205 by MAEEN (SA-MIF) with
      scope kfupm.edu.sa. The other two are on the self-hosted ePrints repository: a fully
      working OAI-PMH 2.0 interface (all six verbs, six metadata formats) and unauthenticated
      JSON record export and search. KFUPM publishes no OpenAPI for any of them; the three
      descriptions now in this repo were derived by probe and are marked as such.

      Expect this to lower KFUPM's score. The previous score was substantially Elsevier's
      contract quality.
