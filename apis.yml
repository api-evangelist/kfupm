- aid: kfupm:eprints-export
  name: KFUPM ePrints Export & Search (JSON)
  x-operator: institution
  description: >-
    Record-level and search-level JSON from the same self-hosted KFUPM ePrints repository, served
    without authentication. /cgi/export/eprint/{eprintid}/JSON/{filename} returns the full record
    as application/json; /cgi/search/simple?q=…&output=JSON returns a JSON result set. The record
    model carries a KFUPM-local `arabic_abstract` alongside `english_abstract`, KFUPM division and
    subject codes, and embargo state on attached documents. It also exposes personal data —
    depositor contact_email, advisor and committee names — and internal EPrints fields (`dir`,
    `userid`). There is no published contract, rate limit or terms for these endpoints.
