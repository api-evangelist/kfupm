x-coverage:
  state: covered
  reason: covered
  detail: >-
    Three institution-operated surfaces were found, probed and described: a SAML 2.0 + OpenID
    Connect identity provider registered in eduGAIN via MAEEN, a live OAI-PMH 2.0 endpoint on a
    self-hosted EPrints repository, and unauthenticated JSON record export and search on the same
    repository. None of them was previously in this profile. What WAS in this profile — 37 OpenAPIs
    and 37 apis[] entries — was one Elsevier Pure contract served from the university's Pure tenant;
    it has been removed and the tenant recorded once instead. KFUPM publishes no developer portal,
    no API documentation, no OpenAPI, no changelog, no status page, no robots.txt, no sitemap and
    no llms.txt on its own domain; the three OpenAPI descriptions in this repo are derived from
    live probes and are marked as such. Two further institution-operated surfaces exist but are
    not machine-readable: the registrar course offering system answers only an HTML form POST, and
    library.kfupm.edu.sa is live behind a Cloudflare bot challenge. Expect this re-profile to lower
    KFUPM's score — the previous score was largely Elsevier's contract quality.
  generated: '2026-08-30'
  method: probed
