aid: kfupm
name: King Fahd University of Petroleum & Minerals
x-type: university
x-category: Public Research University
description: >-
  King Fahd University of Petroleum & Minerals (KFUPM) is a public research university in Dhahran,
  Saudi Arabia. Its programmable footprint is small, and most of what previously appeared in this
  profile was not its own: 37 OpenAPI definitions attributed to KFUPM here were the Elsevier Pure
  Web Services contract (info.title "Pure API", contact pure-support@elsevier.com, version
  5.35.3-4) served from the university's Pure tenant at pure.kfupm.edu.sa. That contract is
  Elsevier's and has been removed; the tenant relationship is recorded instead.

  What KFUPM genuinely operates is three surfaces on its own infrastructure. Its identity provider
  at sts.kfupm.edu.sa publishes signed SAML 2.0 federation metadata and an OpenID Connect discovery
  document, and is registered in eduGAIN through MAEEN, the Saudi identity federation, with scope
  kfupm.edu.sa — an institution-operated machine-readable surface by definition. The KFUPM ePrints
  repository (EPrints 3.4.1) serves a live, unauthenticated OAI-PMH 2.0 harvesting interface with
  six working verbs and six metadata formats, plus record-level and search-level JSON export whose
  record model carries a KFUPM-local `arabic_abstract` field. The registrar publishes a live course
  offering system, but it answers only an HTML form POST and returns no machine-readable format.

  There is no central developer portal, no API documentation, no changelog, no status page, no
  robots.txt, no sitemap and no llms.txt on the university's own domain. The library discovery
  surface sits behind a Cloudflare bot challenge. KFUPM does not publish an OpenAPI for anything it
  operates; the three descriptions in this repo were derived by probing the live endpoints.
